<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (() => {
        const CUSTOM_THEMES_STORAGE_KEY = "t3code:themes:v1";
        // Written while a theme could be paired per appearance; its dark half still wins.
        const LEGACY_THEME_HALVES_STORAGE_KEY = "t3code:theme-halves:v1";
        const DEFAULT_THEME_ID = "borealis";
        // The roles the splash paints, per built-in theme. Keep in step with
        // packages/shared/src/themePalettes.ts.
        const BUILT_IN_THEME_PALETTES = {
          borealis: {
            background: "#08080d",
            foreground: "#eeeeee",
            accent: "#6ff0c4",
            chrome: "#08080d",
          },
          stellar: {
            background: "#141517",
            foreground: "#ececee",
            accent: "#9ba3ff",
            chrome: "#141517",
          },
          "night-edit": {
            background: "#0d1219",
            foreground: "#eeeeee",
            accent: "#a2bfdc",
            chrome: "#0d1219",
          },
          darkroom: {
            background: "#151310",
            foreground: "#eeeeee",
            accent: "#d8b575",
            chrome: "#151310",
          },
          studio: {
            background: "#252525",
            foreground: "#eeeeee",
            accent: "#dedede",
            chrome: "#252525",
          },
        };
        // The runtime completes a custom palette that omits a role from the
        // Stellar palette; the splash does the same so it cannot flash other colors.
        const CUSTOM_THEME_DEFAULTS = BUILT_IN_THEME_PALETTES.stellar;
        const RESERVED_THEME_IDS = [
          "system",
          "light",
          "dark",
          ...Object.keys(BUILT_IN_THEME_PALETTES),
          "t3-code",
          "t3-chat",
          "grove",
          "ocean",
          "ember",
          "iris",
          "t3-chat-dark",
          "t3-grove",
          "t3-ocean",
          "t3-ember",
          "t3-iris",
        ];
        const LEGACY_THEME_IDS = Object.fromEntries(
          RESERVED_THEME_IDS.filter((id) => /^t3-|^(?:grove|ocean|ember|iris)$/.test(id)).map(
            (id) => [id, "stellar"],
          ),
        );
        const setThemeColor = (color) => {
          for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
            meta.setAttribute("content", color);
          }
        };

        // The runtime decodes the same literal CSS formats into OKLCH. Keep
        // contextual colors out: they cannot be resolved from stored data.
        const SYSTEM_COLOR_KEYWORD =
          /^(?:accentcolor(?:text)?|active(?:border|caption|text)|appworkspace|background|button(?:border|face|highlight|shadow|text)|canvas(?:text)?|captiontext|field(?:text)?|graytext|highlight(?:text)?|inactive(?:border|caption(?:text)?)|info(?:background|text)|linktext|mark(?:text)?|menu(?:text)?|scrollbar|selecteditem(?:text)?|threed(?:darkshadow|face|highlight|lightshadow|shadow)|visitedtext|window(?:frame|text)?)$/i;
        const isThemeColor = (value) => {
          if (typeof value !== "string" || typeof CSS === "undefined") return false;
          const color = value.trim();
          if (
            /^(?:currentcolor|inherit|initial|revert|revert-layer|unset)$/i.test(color) ||
            SYSTEM_COLOR_KEYWORD.test(color) ||
            /\bfrom\b|(?:var|env|attr|calc|min|max|clamp)\(/i.test(color)
          ) {
            return false;
          }
          const isLiteralColor =
            /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(color) ||
            /^[a-z]+$/i.test(color) ||
            /^(?:rgba?|hsla?|hwb|lab|lch|oklab|oklch|color)\(/i.test(color);
          return isLiteralColor && CSS.supports("color", color);
        };
        const isRecord = (value) =>
          typeof value === "object" && value !== null && !Array.isArray(value);
        const isThemeId = (value) =>
          typeof value === "string" && /^[a-z0-9](?:[a-z0-9-]{0,47})$/.test(value);
        const isThemeLabel = (value) =>
          typeof value === "string" && value.trim().length > 0 && value.trim().length <= 48;
        // A theme saved before the app went dark-only may be light with a dark
        // variant. Returns its dark colors, or null when it only has a light palette.
        const storedDarkColors = (value) => {
          if (
            !isRecord(value) ||
            !isThemeId(value.id) ||
            RESERVED_THEME_IDS.includes(value.id) ||
            !isThemeLabel(value.label)
          ) {
            return null;
          }
          const colors =
            value.appearance === undefined || value.appearance === "dark"
              ? value.colors
              : value.appearance === "light" && isRecord(value.variants)
                ? value.variants.dark
                : null;
          return isRecord(colors) ? colors : null;
        };
        const findCustomColors = (themeId) => {
          try {
            const parsed = JSON.parse(
              window.localStorage.getItem(CUSTOM_THEMES_STORAGE_KEY) ?? "null",
            );
            if (!Array.isArray(parsed)) return null;
            for (const value of parsed) {
              if (isRecord(value) && value.id === themeId) return storedDarkColors(value);
            }
          } catch {}
          return null;
        };
        // Mirrors readThemePreference: the retired "system", "light" and "dark"
        // values, and any id that no longer resolves, show the default theme.
        const resolveTheme = (stored) => {
          if (typeof stored !== "string") return null;
          const themeId = LEGACY_THEME_IDS[stored] ?? stored;
          const builtIn = BUILT_IN_THEME_PALETTES[themeId];
          if (builtIn) return { id: themeId, palette: builtIn };
          const colors = findCustomColors(themeId);
          if (!colors) return null;
          const pick = (role, fallback) => (isThemeColor(colors[role]) ? colors[role] : fallback);
          return {
            id: themeId,
            palette: {
              background: pick("canvas", CUSTOM_THEME_DEFAULTS.background),
              foreground: pick("text", CUSTOM_THEME_DEFAULTS.foreground),
              accent: pick("accent", CUSTOM_THEME_DEFAULTS.accent),
              chrome: pick("chrome", CUSTOM_THEME_DEFAULTS.chrome),
            },
          };
        };

        let theme = null;
        try {
          let darkHalf = null;
          try {
            const halves = JSON.parse(
              window.localStorage.getItem(LEGACY_THEME_HALVES_STORAGE_KEY) ?? "null",
            );
            darkHalf = isRecord(halves) ? halves.dark : null;
          } catch {}
          theme =
            resolveTheme(darkHalf) ?? resolveTheme(window.localStorage.getItem("t3code:theme"));
        } catch {}
        theme ??= { id: DEFAULT_THEME_ID, palette: BUILT_IN_THEME_PALETTES[DEFAULT_THEME_ID] };
        const root = document.documentElement;
        root.dataset.themeId = theme.id;
        root.style.backgroundColor = theme.palette.chrome;
        for (const name of ["background", "foreground", "accent"]) {
          root.style.setProperty(`--boot-${name}`, theme.palette[name]);
        }
        setThemeColor(theme.palette.chrome);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #000000;
        color: #f5f5f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter Variable", "Segoe UI", system-ui, sans-serif;
      }

      #boot-shell {
        position: relative;
        overflow: hidden;
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: var(--boot-background, inherit);
        color: var(--boot-foreground, inherit);
      }

      #boot-shell-card {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
      }

      #boot-shell-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }

      /* App CSS locks body and #root scrolling once main loads, so the error screen scrolls itself. */
      #boot-shell:has(> #boot-error) {
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }

      #boot-error {
        --boot-error-fg: var(--boot-foreground, #f5f5f5);
        --boot-error-bg: var(--boot-background, #000000);
        --boot-error-line: color-mix(in srgb, currentColor 12%, transparent);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        align-self: flex-start;
        width: min(400px, calc(100% - 48px));
        padding: clamp(24px, 22vh, 220px) 0 24px;
        font-size: 13px;
        line-height: 20px;
      }

      #boot-error h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        line-height: 22px;
      }

      #boot-error p {
        margin: 4px 0 0;
        opacity: 0.7;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      #boot-error code,
      #boot-error pre {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      #boot-error a {
        color: inherit;
        text-decoration-line: underline;
        text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
        text-underline-offset: 3px;
      }

      #boot-error a:hover {
        text-decoration-color: currentColor;
      }

      #boot-error button {
        height: 32px;
        padding: 0 14px;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }

      #boot-error button[aria-disabled="true"] {
        opacity: 0.6;
        cursor: default;
      }

      #boot-error :is(button, a, summary, pre):focus-visible {
        outline: 2px solid var(--boot-error-fg);
        outline-offset: 2px;
      }

      #boot-error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
      }

      #boot-error #boot-error-reload {
        border-color: var(--boot-error-fg);
        background: var(--boot-error-fg);
        color: var(--boot-error-bg);
      }

      #boot-error-reload:hover {
        opacity: 0.9;
      }

      #boot-error #boot-error-update-note {
        margin-top: 8px;
        font-size: 12px;
        line-height: 18px;
      }

      #boot-error details {
        width: 100%;
        margin-top: 32px;
      }

      #boot-error summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 4px;
        list-style: none;
        opacity: 0.7;
        cursor: pointer;
      }

      #boot-error summary::-webkit-details-marker {
        display: none;
      }

      #boot-error summary::before {
        content: "";
        width: 5px;
        height: 5px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
      }

      #boot-error details[open] summary::before {
        transform: rotate(45deg);
      }

      #boot-error summary:hover,
      #boot-error details[open] summary {
        opacity: 1;
      }

      #boot-error details > :not(summary) {
        display: grid;
        gap: 8px;
        margin-top: 20px;
      }

      #boot-error details > a {
        display: block;
        width: fit-content;
      }

      #boot-error details p {
        margin: 0;
        font-size: 12px;
        line-height: 18px;
      }

      #boot-error-command {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 4px 10px;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
      }

      #boot-error-command code {
        flex: 1;
        min-width: 0;
        opacity: 0.8;
      }

      #boot-error .boot-error-icon {
        display: grid;
        flex: none;
        place-items: center;
        min-width: 24px;
        height: 24px;
        padding: 0 4px;
        border: 0;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 400;
        opacity: 0.7;
      }

      #boot-error .boot-error-icon:hover {
        opacity: 1;
        background: color-mix(in srgb, currentColor 8%, transparent);
      }

      #boot-error-details {
        max-height: 200px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border: 1px solid var(--boot-error-line);
        border-radius: 6px;
        font-size: 11px;
        line-height: 16px;
        white-space: pre-wrap;
        opacity: 0.8;
      }

      #boot-error-report {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #boot-error-report button {
        height: 28px;
        padding: 0 10px;
      }

      .boot-error-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <title>Stellar</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Stellar splash screen">
          <img id="boot-shell-logo" src="/apple-touch-icon.png" alt="Stellar" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
